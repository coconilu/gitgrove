name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Rust 依赖缓存：prefix-key 含 workflow 名，gitgrove-CI-* 与 release.yml 的
      # gitgrove-Release-* 是互不相通的缓存命名空间（check 产物暖不了 release 构建）；
      # job id / os / rustc / Cargo.lock 哈希由 action 自动并入 key，
      # lockfile 变动时自动回退到旧 lock 的缓存，只重建变化的部分。
      # PR 只读 master 缓存不写入，避免缓存池被 PR 分支灌满。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gitgrove-${{ github.workflow }}
          workspaces: app/src-tauri
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        working-directory: app
        run: pnpm lint

      - name: Build frontend
        working-directory: app
        run: pnpm build

      - name: Test release guards
        run: node --test .github/scripts/*.test.mjs

      - name: Test navigation
        working-directory: app
        run: pnpm test

      - name: Check Tauri shell (cargo check)
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - name: Test workflow metadata parser
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --lib

  # check job 只跑 Windows，跨平台编译错误（如 #[cfg] 摘掉的函数被 cfg! 分支引用）拦不住；
  # 这里只做 Rust 侧 cargo check，不做全量 build
  check-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 与 check job 同属 gitgrove-CI-* 命名空间；job id 不同，两边缓存各自独立
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gitgrove-${{ github.workflow }}
          workspaces: app/src-tauri
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check Tauri shell (cargo check)
        run: cargo check --locked --manifest-path app/src-tauri/Cargo.toml
