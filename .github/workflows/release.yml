name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本增量（自动检查、构建并发布；none 重试当前版本）"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]

permissions:
  contents: read

concurrency:
  group: gitgrove-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Bump version, run CI and merge automatically
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/prepare-release.mjs

  version:
    needs: prepare
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
      (inputs.bump == 'none' || needs.prepare.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
      # 校验脚本来自当前可信的默认分支；它只读取候选提交，不执行候选代码。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate release commit and CI
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARED_SHA: ${{ needs.prepare.outputs.sha }}
        run: node .github/scripts/release-target.mjs

  # 双平台构建：Windows NSIS 安装包 + macOS DMG（未做 Apple 签名/公证）
  build:
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 构建与发布固定到同一个通过 CI 的提交
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      # 缓存命名空间 gitgrove-Release-* 与 ci.yml 的 gitgrove-CI-* 互不相通：
      # check 只产出 rmeta，暖不了这里的完整 release 编译，首次发版冷、
      # 同 lockfile 的重试与后续发版热
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gitgrove-${{ github.workflow }}
          workspaces: app/src-tauri
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build desktop installer (Tauri)
        # createUpdaterArtifacts 只在发布构建时开启：它要求签名私钥，
        # 留在默认配置里会导致本地无密钥时 tauri build 失败
        shell: bash # 默认 pwsh 会吞掉 --config JSON 里的双引号
        working-directory: app
        run: pnpm exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          # updater 签名私钥（minisign，与 Apple 签名无关），存于仓库 Secrets；对应公钥写死在 tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        # upload-artifact 对多路径取最小公共祖先作为根目录，会把 macos/ 与 dmg/ 变成两层子目录；
        # 先归拢到扁平的 staging 目录再上传，保证 publish 端的目录约定成立
        run: |
          mkdir -p release-staging
          cp app/src-tauri/target/release/bundle/macos/*.app.tar.gz* release-staging/
          cp app/src-tauri/target/release/bundle/dmg/*.dmg release-staging/

      - name: Upload macOS artifacts (artifact)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: release-staging/*

  # 汇总双平台产物，生成 updater manifest 并发布 Release
  publish:
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist-release/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist-release/macos

      - name: Generate updater manifest (latest.json)
        run: node .github/scripts/gen-latest-json.mjs "${{ needs.version.outputs.tag }}" dist-release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: GitGrove ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          draft: true
          fail_on_unmatched_files: true
          # prerelease 由 release-target.mjs 输出；当前只有手动 dispatch 触发，恒为 false。
          # 保留透传：出现预发布入口时发布步骤无需改动，且预发布不会抢占 releases/latest
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: |
            dist-release/windows/*.exe
            dist-release/macos/*.dmg
            dist-release/macos/*.app.tar.gz
            dist-release/latest.json
      - name: Publish complete draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
