name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  verify-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify approval of the known version-only PR CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root = 'https://api.github.com/repos/coconilu/gitgrove';
          const headers = {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json'};
          const get = async path => { const r = await fetch(root + path, {headers}); if (!r.ok) throw new Error('GET ' + path + ': ' + r.status); return r.json(); };
          const pr = await get('/pulls/11');
          const run = await get('/actions/runs/34094309758');
          const files = await get('/pulls/11/files');
          const sha = '78085f2ba5f92c417eec0e941e3f80f58abf209d';
          const allowed = new Set(['app/package.json','app/src-tauri/tauri.conf.json','CHANGELOG.md']);
          if (pr.state !== 'open' || pr.head.sha !== sha || pr.head.repo.full_name !== 'coconilu/gitgrove' || files.length !== 3 || files.some(f => !allowed.has(f.filename)) || run.head_sha !== sha || run.event !== 'pull_request' || run.conclusion !== 'action_required') throw new Error('Version PR/run evidence changed; do not approve');
          const result = await fetch(root + '/actions/runs/34094309758/approve', {method:'POST', headers});
          console.log('Approval endpoint HTTP ' + result.status);
          console.log(await result.text());
          if (!result.ok) process.exitCode = 1;
          NODE
